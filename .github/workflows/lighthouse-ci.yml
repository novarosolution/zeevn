name: Lighthouse CI

on:
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  lhci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Optimize static assets
        run: node scripts/optimize-hero-images.js && node scripts/copy-fonts-public.js

      - name: Export web bundle
        run: npm run export:web

      - name: Serve dist (SPA fallback)
        run: npx serve -s dist -l 8080 &
        
      - name: Wait for server
        run: npx wait-on http://127.0.0.1:8080 --timeout 60000

      - name: Run Lighthouse CI
        run: npm run lhci
        env:
          LHCI_BASE_URL: http://127.0.0.1:8080
